# 画像生成の候補を実測するための一時的な調べもの用ワークフロー。
# ゲームにもツールにも影響しない(このブランチにしか無く、mainへは入れない)。
# 実行するとCORSの可否と、実際に作れた画像を results/ へコミットする。
name: imagegen probe
on:
  push:
    branches: [imagegen-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CORSの可否を調べる(ブラウザから直接叩けるか)
        run: |
          set +e
          mkdir -p results
          ORIGIN=https://komekome898-web.github.io
          probe_cors () {
            echo "=== $1"
            curl -s -i -X OPTIONS "$1" \
              -H "Origin: $ORIGIN" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type,authorization" \
              --max-time 20 | grep -iE "^HTTP|access-control-allow-(origin|methods|headers)" || echo "(CORSヘッダーなし)"
            echo
          }
          {
            probe_cors "https://image.pollinations.ai/prompt/test"
            probe_cors "https://router.huggingface.co/v1/images/generations"
            probe_cors "https://api.cloudflare.com/client/v4/accounts/x/ai/run/@cf/black-forest-labs/flux-1-schnell"
            probe_cors "https://aihorde.net/api/v2/generate/async"
            probe_cors "https://api.openai.com/v1/images/edits"
          } | tee results/cors.txt
      - name: キー不要の提供元で実際に作ってみる(参考画像あり/なし)
        run: |
          set +e
          BASE=https://raw.githubusercontent.com/${{ github.repository }}/main/monsters/guts_ssr.png
          P='full body character, awakened dark armored form, standing front view, solid pure green background'
          enc () { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          try () {   # $1=出力名  $2=URL
            echo "--- $1"
            code=$(curl -s -o "results/$1" -w "%{http_code} %{content_type} %{size_download}" --max-time 180 "$2")
            echo "$2"
            echo "  -> $code"
            file "results/$1" 2>/dev/null | sed 's/^/  /'
          }
          {
            try pollinations_txt2img.png \
              "https://image.pollinations.ai/prompt/$(enc "$P")?width=768&height=1024&nologo=true&safe=false"
            try pollinations_img2img.png \
              "https://image.pollinations.ai/prompt/$(enc "$P")?model=kontext&image=$(enc "$BASE")&width=768&height=1024&nologo=true"
          } | tee results/generate.txt
      - name: 結果をこのブランチへ戻す
        run: |
          git config user.name  "imagegen-probe"
          git config user.email "noreply@github.com"
          git add -A results
          git commit -m "probe: 実測結果" || echo "変更なし"
          git push origin HEAD:imagegen-probe

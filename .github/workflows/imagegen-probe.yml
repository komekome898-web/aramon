# 画像生成の候補を実測するための一時的な調べもの用ワークフロー。
# ゲームにもツールにも影響しない(このブランチにしか無く、mainへは入れない)。
name: imagegen probe
on:
  push:
    branches: [imagegen-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 元の絵を img2img へ渡せる形にする
        run: |
          sudo apt-get install -y webp >/dev/null 2>&1 || true
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('monsters/guts_ssr.png').convert('RGBA')
          bg = Image.new('RGB', im.size, (0,255,0)); bg.paste(im, mask=im.split()[3])
          bg = bg.resize((512,512))
          bg.save('/tmp/src.webp', 'WEBP', quality=90)
          print('src.webp', bg.size)
          PY
      - name: AI Horde(完全無料・匿名キー)で img2img を試す
        run: |
          set +e
          mkdir -p results
          python3 - <<'PY' 2>&1 | tee results/horde.txt
          import base64, json, time, urllib.request
          B = 'https://aihorde.net/api/v2'
          H = {'apikey':'0000000000', 'Content-Type':'application/json',
               'Client-Agent':'aramon-probe:1.0:github'}
          src = base64.b64encode(open('/tmp/src.webp','rb').read()).decode()
          body = {
            'prompt': 'awakened dark armored warrior, black spiked plate armor, horned helmet, '
                      'full body, standing front view, solid pure green background '
                      '### blurry, cropped, text, watermark',
            'params': {'width':512, 'height':512, 'steps':25, 'n':1,
                       'denoising_strength':0.55, 'sampler_name':'k_euler_a', 'cfg_scale':7},
            'source_image': src, 'source_processing': 'img2img',
            'nsfw': False, 'models': ['AlbedoBase XL (SDXL)'],
          }
          def post(path, data):
              r = urllib.request.Request(B+path, json.dumps(data).encode(), H)
              return json.load(urllib.request.urlopen(r, timeout=60))
          import urllib.error
          def show_err(e):
              try: print('  応答本文:', e.read().decode()[:400])
              except Exception: pass
          # まず一番簡単な txt2img で、APIそのものが使えるかを見る
          try:
              t = post('/generate/async', {'prompt':'a red apple','params':{'width':512,'height':512,'steps':10,'n':1},'nsfw':False})
              print('txt2img 受付OK:', t.get('id'))
          except urllib.error.HTTPError as e:
              print('txt2img だめ:', e.code); show_err(e)
          except Exception as e:
              print('txt2img だめ:', e)
          try:
              j = post('/generate/async', body)
          except urllib.error.HTTPError as e:
              print('img2img だめ:', e.code); show_err(e); raise SystemExit(0)
          except Exception as e:
              print('img2img だめ:', e); raise SystemExit(0)
          jid = j.get('id'); print('受付ID:', jid)
          img = None
          for i in range(60):
              time.sleep(10)
              r = urllib.request.Request(f'{B}/generate/status/{jid}', headers=H)
              st = json.load(urllib.request.urlopen(r, timeout=60))
              print(f'{i*10:4d}秒  done={st.get("done")} 待ち={st.get("queue_position")} '
                    f'待機予測={st.get("wait_time")}秒')
              if st.get('done'):
                  g = (st.get('generations') or [])
                  if g: img = g[0].get('img')
                  break
          if not img: print('時間内に返りませんでした'); raise SystemExit(0)
          data = urllib.request.urlopen(img, timeout=120).read() if img.startswith('http') \
                 else base64.b64decode(img)
          open('results/horde_img2img.webp','wb').write(data)
          print('できた画像:', len(data), 'バイト')
          PY
      - name: 結果をこのブランチへ戻す
        if: always()
        run: |
          git config user.name  "imagegen-probe"
          git config user.email "noreply@github.com"
          git add -A results
          git commit -m "probe: AI Horde の実測結果" || echo "変更なし"
          git push origin HEAD:imagegen-probe
